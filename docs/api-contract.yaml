openapi: 3.0.3
info:
  title: TiketKilat Reservation API
  version: 1.0.0
  description: Core reservation services for high-concurrency ticket flash sale platform.
paths:
  /events:
    get:
      summary: Get list of events
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /events/{id}/seats:
    get:
      summary: Get list of seats and status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Seat'

  /reservations:
    post:
      summary: Hold seats for reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event_id
                - seat_ids
              properties:
                event_id:
                  type: string
                seat_ids:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Seats held successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  hold_id:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        '409':
          description: Seat conflict or already held/booked

  /reservations/{holdId}/confirm:
    post:
      summary: Confirm reservation and process payment
      parameters:
        - name: holdId
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Booking confirmed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking_id:
                    type: string
                  status:
                    type: string
                    example: BOOKED
        '400':
          description: Missing Idempotency-Key or Invalid Request
        '410':
          description: Reservation hold expired

  /reservations/{holdId}:
    get:
      summary: Get hold or booking status
      parameters:
        - name: holdId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'

    delete:
      summary: Release hold manually
      parameters:
        - name: holdId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Hold released successfully

  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Application healthy

  /readiness:
    get:
      summary: Readiness check
      responses:
        '200':
          description: Dependencies (DB, Redis) ready

components:
  schemas:
    Event:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
        event_date:
          type: string
          format: date-time
    Seat:
      type: object
      properties:
        id:
          type: string
        seat_number:
          type: string
        status:
          type: string
          enum: [available, held, booked]
    Reservation:
      type: object
      properties:
        hold_id:
          type: string
        event_id:
          type: string
        seat_ids:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [HELD, BOOKED, EXPIRED, CANCELLED]
        expires_at:
          type: string
          format: date-time
    Pagination:
      type: object
      properties:
        current_page:
          type: integer
        total_pages:
          type: integer
        total_items:
          type: integer